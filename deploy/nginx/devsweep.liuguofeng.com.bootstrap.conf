# Temporary HTTP-only vhost used to issue the first certificate.
server {
    listen 80;
    listen [::]:80;
    server_name devsweep.liuguofeng.com;

    location ^~ /.well-known/acme-challenge/ {
        root /home/wwwroot/default;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        root /home/wwwroot/devsweep.liuguofeng.com;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
